{% extends "_base.html" %}
{% block title %}จัดการข้อมูล{% endblock %}
{% block body %}
<div class="tabs" id="tabs"></div>

<section class="card">
  <h3>ค้นหา <span id="searchTitle"></span></h3>
  <div id="searchFields" class="search-grid"></div>
  <div class="btn-row">
    <button class="btn add" id="btnAdd">+ เพิ่มข้อมูลใหม่</button>
    <button class="btn" id="btnClear" style="margin-left:auto">ล้างเงื่อนไข</button>
    <button class="btn primary" id="btnSearch">🔍 ค้นหา</button>
  </div>
</section>

<section class="card">
  <div class="result-head">
    <div id="status" class="status"></div>
    <div class="legend">หัวตาราง: <span class="lg own">คอลัมน์ของตารางนี้</span><span class="lg join">มาจากตารางอื่น (JOIN)</span><span class="lg calc">คำนวณ / นับ</span></div>
  </div>
  <div id="sqlBox"></div>
  <div class="table-wrap"><table id="resultTable"><thead><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table></div>
</section>

<section class="card hidden" id="lastCmd">
  <h3>คำสั่งที่รันล่าสุด</h3>
  <div id="lastCmdBody"></div>
</section>

<!-- ฟอร์มเพิ่ม / แก้ไข -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modalTitle">เพิ่มข้อมูล</h3>
    <div id="formFields"></div>
    <div class="btn-row">
      <button class="btn primary" id="btnSave">บันทึก</button>
      <button class="btn" id="btnCancel">ยกเลิก</button>
    </div>
  </div>
</div>

<!-- รายละเอียด (ผลการเรียน / กลุ่มที่สอน / รายชื่อนิสิต) -->
<div id="detail" class="modal hidden">
  <div class="modal-box wide">
    <div class="detail-head"><img id="detailPhoto" class="avatar lg hidden" alt=""><h3 id="detailTitle"></h3></div>
    <div id="detailBody"></div>
    <div class="btn-row"><button class="btn" id="btnDetailClose" style="margin-left:auto">ปิด</button></div>
  </div>
</div>
{% endblock %}
{% block script %}<script src="{{ url_for('static', filename='app.js') }}"></script>{% endblock %}
